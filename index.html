<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>株価カレンダー</title>
<style>
:root{color-scheme:dark;--bg:#171717;--card:#242424;--line:#353535;--text:#f5f5f5;--muted:#aaa;--green:#24563d;--red:#703535;--accent:#65a9ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
main{max-width:850px;margin:auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px}
h1{font-size:22px;margin:0}
button,select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit}
button{cursor:pointer}
.toolbar{display:flex;gap:8px;margin-bottom:14px}
select{flex:1;min-width:0}
.monthbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
#month{font-size:19px;font-weight:750;text-align:center}
.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.weekdays div{text-align:center;color:var(--muted);font-size:12px;padding:8px 0}
.day{min-width:0;min-height:94px;padding:6px 3px;background:var(--card);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.day.up{background:var(--green)}
.day.down{background:var(--red)}
.day.selected{outline:2px solid var(--accent)}
.day.empty{background:transparent;border-color:transparent}
.date{font-size:11px;color:#ddd}
.close{font-size:clamp(10px,2.4vw,15px);font-weight:750;white-space:nowrap}
.change,.pct{font-size:clamp(9px,2vw,12px);white-space:nowrap}
.uptext{color:#91efb4}.downtext{color:#ffaaaa}
.muted{color:var(--muted)}
.legend{display:flex;justify-content:center;gap:16px;margin:14px 0;color:var(--muted);font-size:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:14px}
.big{font-size:28px;font-weight:800;margin:5px 0}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.metric{background:#303030;padding:12px;border-radius:10px}
.metric strong{display:block;font-size:20px;margin-top:5px}.positive{color:#91efb4}.negative{color:#ffaaaa}.neutral{color:var(--muted)}
.note{font-size:12px;line-height:1.7;color:var(--muted)}
@media(max-width:430px){main{padding:9px}.day{min-height:76px;padding:4px 2px;gap:4px}.monthbar button{padding:8px 5px;font-size:12px}h1{font-size:19px}}
</style>
</head>
<body>
<main>
<header><h1>📈 株価カレンダー</h1><span class="muted">β版</span></header>
<div class="toolbar">
<select id="index" aria-label="指数">
<option value="nikkei">日経平均</option>
<option value="topix">TOPIX</option>
<option value="nasdaq">NASDAQ総合</option>
</select>
<button id="refresh">更新</button>
</div>
<div class="monthbar">
<button id="prev">‹ 前月</button>
<div id="month"></div>
<button id="next">翌月 ›</button>
</div>
<div class="weekdays">
<div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div><div>日</div>
</div>
<div id="calendar" class="calendar"></div>
<div class="legend"><span>🟢 上昇</span><span>🔴 下落</span><span>— 未登録</span></div>
<section class="panel" id="detail">
<div class="muted">日付を選択してください</div>
<div class="note">株価データの接続準備中です。</div>
</section>
<section class="panel">
<h3 style="margin-top:0">月間のまとめ</h3>
<div class="metrics">
<div class="metric"><span class="muted">登録日数</span><strong id="count">0日</strong></div>
<div class="metric"><span class="muted">上昇 / 下落</span><strong id="days">— / —</strong></div>
</div>
<p class="note" id="status">株価データ：未接続</p>
</section>
<section class="panel" id="performance">
  <h3 style="margin-top:0">期間別パフォーマンス</h3>
  <p class="note" id="performanceDate">比較対象を計算中…</p>
  <div class="metrics">
    <div class="metric">
      <span class="muted" id="monthLabel">月初来（前月末比）</span>
      <strong id="monthChange">—</strong>
      <span class="note" id="monthChangeValue">—</span>
    </div>
    <div class="metric">
      <span class="muted" id="yearLabel">年初来（前年末比）</span>
      <strong id="yearChange">—</strong>
      <span class="note" id="yearChangeValue">—</span>
    </div>
  </div>
</section>
<p class="note">株価データは同じフォルダの data.json から読み込みます。データファイルの更新後は「更新」ボタンを押してください。</p>
</main>
<script>
const $ = id => document.getElementById(id);
const today = new Date();
let year = today.getFullYear();
let month = today.getMonth() + 1; // 1〜12月
const key = (y, m, d) => `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
let selected = key(year, month, today.getDate());
let prices = {};
let index = 'nikkei';

const fmt = n => Math.abs(n).toLocaleString('ja-JP');

async function loadPrices() {
  $('status').textContent = '株価データ：読み込み中…';
  try {
    const response = await fetch('./data.json', { cache: 'no-store' });
    if (!response.ok) throw new Error(`data.json の読み込みに失敗しました (${response.status})`);
    const json = await response.json();
    prices = json.data || {};
    $('status').textContent = `株価データ：接続済み（更新 ${json.updatedAt || '日時不明'}）`;
    render();
  } catch (error) {
    prices = {};
    $('status').textContent = '株価データ：読み込み失敗。サーバー経由で開いているか、data.jsonを確認してください。';
    console.error(error);
    render();
  }
}


function sortedPriceEntries(market) {
  return Object.entries(prices[market] || {})
    .filter(([date, v]) => /^\d{4}-\d{2}-\d{2}$/.test(date) && Number.isFinite(Number(v?.close)))
    .sort(([a],[b]) => a.localeCompare(b));
}
function renderPerformance() {
  const entries = sortedPriceEntries(index);
  const latest = entries.length ? entries[entries.length - 1] : null;
  const fmtDate = d => d ? `${Number(d.slice(5,7))}月${Number(d.slice(8,10))}日` : '—';
  function show(prefix, baseEntry) {
    const pctEl = $(prefix + 'Change');
    const valueEl = $(prefix + 'ChangeValue');
    if (!latest || !baseEntry || Number(baseEntry[1].close) === 0) {
      pctEl.textContent = '—';
      pctEl.className = 'neutral';
      valueEl.textContent = '比較できるデータがありません';
      return;
    }
    const diff = Number(latest[1].close) - Number(baseEntry[1].close);
    const pct = diff / Number(baseEntry[1].close) * 100;
    pctEl.textContent = `${pct > 0 ? '+' : ''}${pct.toFixed(2)}%`;
    pctEl.className = pct > 0 ? 'positive' : pct < 0 ? 'negative' : 'neutral';
    valueEl.textContent = `${diff > 0 ? '+' : diff < 0 ? '−' : '±'}${Math.abs(diff).toLocaleString('ja-JP', {maximumFractionDigits:2})}（基準 ${Number(baseEntry[1].close).toLocaleString('ja-JP', {maximumFractionDigits:2})}）`;
  }
  if (!latest) {
    $('performanceDate').textContent = '株価データがありません。';
    ['month','year'].forEach(k => { $(k+'Change').textContent='—'; $(k+'ChangeValue').textContent='—'; });
    return;
  }
  const [latestDate, latestValue] = latest;
  const [y, m] = latestDate.split('-').map(Number);
  const monthBase = entries.filter(([date]) => date < `${y}-${String(m).padStart(2,'0')}-01`).slice(-1)[0] || null;
  const yearBase = entries.filter(([date]) => date < `${y}-01-01`).slice(-1)[0] || null;
  $('performanceDate').textContent = `最新データ：${latestDate}（${Number(latestValue.close).toLocaleString('ja-JP', {maximumFractionDigits:2})}${index === 'nasdaq' ? '' : '円'}）`;
  $('monthLabel').textContent = monthBase ? `月初来（${fmtDate(monthBase[0])}比）` : '月初来（前月末比）';
  $('yearLabel').textContent = yearBase ? `年初来（${fmtDate(yearBase[0])}比）` : '年初来（前年末比）';
  show('month', monthBase);
  show('year', yearBase);
}

function render() {
  $('month').textContent = `${year}年${month}月`;
  const first = new Date(year, month - 1, 1);
  const total = new Date(year, month, 0).getDate();
  const offset = (first.getDay() + 6) % 7;
  const cal = $('calendar');
  cal.innerHTML = '';

  for (let i = 0; i < offset; i++) {
    const empty = document.createElement('div');
    empty.className = 'day empty';
    cal.appendChild(empty);
  }

  let up = 0, down = 0, count = 0;
  for (let d = 1; d <= total; d++) {
    const k = key(year, month, d);
    const v = prices[index]?.[k];
    const b = document.createElement('button');
    b.className = 'day' + (v ? (v.change > 0 ? ' up' : v.change < 0 ? ' down' : '') : '') + (selected === k ? ' selected' : '');
    let html = `<span class="date">${d}</span>`;
    if (v) {
      count++;
      if (v.change > 0) up++;
      if (v.change < 0) down++;
      html += `<span class="close">${fmt(v.close)}</span>`;
      html += `<span class="change">${v.change > 0 ? '+' : v.change < 0 ? '−' : '±'}${fmt(v.change)}</span>`;
      html += `<span class="pct">${v.pct > 0 ? '+' : ''}${Number(v.pct).toFixed(2)}%</span>`;
    } else {
      html += '<span class="muted" style="font-size:11px">—</span>';
    }
    b.innerHTML = html;
    b.addEventListener('click', () => { selected = k; render(); });
    cal.appendChild(b);
  }

  $('count').textContent = count + '日';
  $('days').textContent = count ? `${up}日 / ${down}日` : '— / —';
  renderPerformance();

  const v = prices[index]?.[selected];
  const p = selected.split('-').map(Number);
  const dt = new Date(p[0], p[1] - 1, p[2]);
  const weekdays = '日月火水木金土';
  $('detail').innerHTML =
    `<div class="muted">${p[0]}年${p[1]}月${p[2]}日（${weekdays[dt.getDay()]}）</div>` +
    (v
      ? `<div class="big">${fmt(v.close)}${index === 'nasdaq' ? '' : '円'}</div><div class="${v.change >= 0 ? 'uptext' : 'downtext'}">${v.change > 0 ? '▲' : v.change < 0 ? '▼' : '—'} ${v.change > 0 ? '+' : v.change < 0 ? '−' : ''}${fmt(v.change)}　${v.pct > 0 ? '+' : ''}${Number(v.pct).toFixed(2)}%</div>`
      : '<div class="big">データ未登録</div><div class="note">この日付のデータはありません。</div>');
}

$('prev').onclick = () => {
  month--;
  if (month < 1) { month = 12; year--; }
  selected = key(year, month, 1);
  render();
};
$('next').onclick = () => {
  month++;
  if (month > 12) { month = 1; year++; }
  selected = key(year, month, 1);
  render();
};
$('index').onchange = e => { index = e.target.value; render(); };
$('refresh').onclick = () => { loadPrices(); };

render();
loadPrices();
</script>
</body>
</html>
