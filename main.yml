name: Update Stock Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1-6" # 19:00 JST, Monday-Saturday

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade yfinance pandas

      - name: Download index data with retries and diagnostics
        run: |
          python - <<'PY'
          import json
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          import pandas as pd
          import yfinance as yf

          symbols = {
              "nikkei": "^N225",
              "topix": "998405.T",
              "nasdaq": "^IXIC",
              # This is an ETN linked to the Growth Market 250 Index, not the index itself.
              "growth250": "2042.T",
          }

          result = {}
          failures = []
          for key, symbol in symbols.items():
              rows = {}
              last_error = None
              for attempt in range(1, 4):
                  try:
                      print(f"\n=== {key}: {symbol}, attempt {attempt}/3 ===", flush=True)
                      hist = yf.Ticker(symbol).history(period="5y", interval="1d", auto_adjust=False, raise_errors=True)
                      if hist is None or hist.empty or "Close" not in hist:
                          raise RuntimeError("Yahoo Finance returned an empty history")
                      close_col = hist["Close"].dropna()
                      previous = None
                      for ts, close in close_col.items():
                          value = float(close)
                          change = value - previous if previous is not None else 0.0
                          pct = change / previous * 100.0 if previous not in (None, 0) else 0.0
                          rows[pd.Timestamp(ts).strftime("%Y-%m-%d")] = {
                              "close": round(value, 4),
                              "change": round(change, 4),
                              "pct": round(pct, 4),
                          }
                          previous = value
                      if not rows:
                          raise RuntimeError("History contained no valid closing prices")
                      print(f"SUCCESS {key} ({symbol}): {len(rows)} rows; latest={next(reversed(rows))} close={rows[next(reversed(rows))]['close']}", flush=True)
                      break
                  except Exception as exc:
                      last_error = repr(exc)
                      print(f"FAILED attempt {attempt} for {key} ({symbol}): {last_error}", flush=True)
                      if attempt < 3:
                          time.sleep(4 * attempt)
              if rows:
                  result[key] = rows
              else:
                  failures.append(f"{key} ({symbol}): {last_error}")

          # Do not publish a new data.json if either newly added index failed.
          required = ["topix", "growth250"]
          missing_required = [key for key in required if not result.get(key)]
          if missing_required:
              print("\nERROR: Newly added series failed: " + "; ".join(failures), flush=True)
              raise SystemExit(1)

          path = Path("data.json")
          old = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {"data": {}}
          old_data = old.get("data", {})
          for key, rows in result.items():
              # Replace only with a non-empty result; keep previous data if an optional series fails.
              if rows:
                  old_data[key] = rows

          payload = {
              "updatedAt": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "data": old_data,
          }
          path.write_text(json.dumps(payload, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          print("\nUpdated data.json series:", ", ".join(f"{k}={len(v)} rows" for k, v in old_data.items()), flush=True)
          if failures:
              print("WARNING: optional series not refreshed: " + "; ".join(failures), flush=True)
          PY

      - name: Commit updated data
        run: |
          if git diff --quiet -- data.json; then
            echo "No stock data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Update stock index data"
            git push
          fi
