name: Update Stock Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1-6" # 19:00 JST, Monday-Saturday

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Download index data
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import pandas as pd
          import yfinance as yf

          # 2042.T is an ETN linked to the TSE Growth Market 250 Index,
          # not the index value itself. It is used as a practical proxy because
          # a reliable public Yahoo Finance ticker for the index itself was not verified.
          symbols = {
              "nikkei": "^N225",
              "topix": "998405.T",
              "nasdaq": "^IXIC",
              "growth250": "2042.T",
          }
          result = {}
          for key, symbol in symbols.items():
              try:
                  hist = yf.download(symbol, period="5y", interval="1d", auto_adjust=False, progress=False)
                  if hist.empty:
                      print(f"WARNING: no data returned for {key} ({symbol})")
                      result[key] = {}
                      continue
                  close_col = hist["Close"]
                  if isinstance(close_col, pd.DataFrame):
                      close_col = close_col.iloc[:, 0]
                  close_col = close_col.dropna()
                  rows = {}
                  previous = None
                  for ts, close in close_col.items():
                      value = float(close)
                      change = value - previous if previous is not None else 0.0
                      pct = (change / previous * 100.0) if previous not in (None, 0) else 0.0
                      rows[pd.Timestamp(ts).strftime("%Y-%m-%d")] = {
                          "close": round(value, 4),
                          "change": round(change, 4),
                          "pct": round(pct, 4),
                      }
                      previous = value
                  result[key] = rows
                  print(f"{key} ({symbol}): {len(rows)} rows")
              except Exception as exc:
                  print(f"WARNING: failed to download {key} ({symbol}): {exc}")
                  result[key] = {}

          # Do not overwrite a previously populated series with an empty result.
          path = Path("data.json")
          old = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {"data": {}}
          old_data = old.get("data", {})
          for key, rows in result.items():
              if rows:
                  old_data[key] = rows
              else:
                  old_data.setdefault(key, {})
          payload = {
              "updatedAt": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "data": old_data,
          }
          path.write_text(json.dumps(payload, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          PY

      - name: Commit updated data
        run: |
          if git diff --quiet -- data.json; then
            echo "No stock data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Update stock index data"
            git push
          fi
