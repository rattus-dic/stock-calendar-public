name: Refresh Important Market Events and Earnings

on:
  schedule:
    - cron: "0 21 * * *" # 毎日06:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-market-events-and-earnings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh official macro event schedules
        run: python scripts/update_events.py
      - name: Refresh 50-company earnings calendar
        run: python scripts/update_earnings.py
      - name: Commit changed event and earnings data
        run: |
          if ! git diff --quiet -- events.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add events.json
            git commit -m "Refresh market events and earnings calendar"
            git push
          else
            echo "No event data changes."
          fi
