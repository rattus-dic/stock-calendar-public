name: Update US Markets and Bond Yields

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1-5" # 10:00 JST, Monday-Friday

permissions:
  contents: write

# Use the same group as the Japanese-index workflow to prevent concurrent
# writes to data.json and market_history.json.
concurrency:
  group: stock-data-update
  cancel-in-progress: false

jobs:
  update-markets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install yfinance pandas requests

      - name: Download US index and market-indicator data
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from io import BytesIO
          from pathlib import Path

          import pandas as pd
          import requests
          import yfinance as yf

          # Keep Japanese indexes out of this workflow.
          index_symbols = {
              "nasdaq": "^IXIC",
              "sox": "^SOX",
          }
          indicator_symbols = {
              "wti": "CL=F",
              "brent": "BZ=F",
              "us10y": "^TNX",
          }

          index_updates = {}
          indicator_updates = {}
          daily_history = {}

          def download_close(symbol, label):
              print(f"Downloading {label}: {symbol}", flush=True)
              hist = yf.Ticker(symbol).history(
                  period="5y",
                  interval="1d",
                  auto_adjust=False,
                  raise_errors=True,
              )
              if hist is None or hist.empty or "Close" not in hist:
                  raise RuntimeError(f"No data received for {symbol}")
              close = hist["Close"].dropna()
              if close.empty:
                  raise RuntimeError(f"No valid closing prices for {symbol}")
              return close

          for name, symbol in index_symbols.items():
              close = download_close(symbol, name)
              rows = {}
              previous = None
              for ts, raw_value in close.items():
                  value = float(raw_value)
                  change = value - previous if previous is not None else None
                  pct = (change / previous * 100.0) if previous not in (None, 0) else None
                  day = pd.Timestamp(ts).strftime("%Y-%m-%d")
                  rows[day] = {
                      "close": round(value, 4),
                      "change": round(change, 4) if change is not None else None,
                      "pct": round(pct, 4) if pct is not None else None,
                  }
                  previous = value
              index_updates[name] = rows
              print(f"{name}: {len(rows)} rows; latest={next(reversed(rows))}", flush=True)

          for name, symbol in indicator_symbols.items():
              close = download_close(symbol, name)
              for ts, raw_value in close.items():
                  day = pd.Timestamp(ts).strftime("%Y-%m-%d")
                  daily_history.setdefault(day, {})[name] = round(float(raw_value), 4)

              indicator_updates[name] = {
                  "latest": {
                      "date": pd.Timestamp(close.index[-1]).strftime("%Y-%m-%d"),
                      "value": round(float(close.iloc[-1]), 4),
                  },
                  "previous": ({
                      "date": pd.Timestamp(close.index[-2]).strftime("%Y-%m-%d"),
                      "value": round(float(close.iloc[-2]), 4),
                  } if len(close) > 1 else None),
              }

          # Japan 10-year government bond yield: MOF CSVs.
          # If the MOF source is temporarily unavailable, continue updating the
          # US indexes, oil, and US 10Y; preserve the existing jp10y value.
          historical_url = "https://www.mof.go.jp/english/policy/jgbs/reference/interest_rate/historical/jgbcme_all.csv"
          latest_url = "https://www.mof.go.jp/jgbs/reference/interest_rate/jgbcm.csv"
          jp_rows = []

          try:
              response = requests.get(historical_url, timeout=45)
              response.raise_for_status()
              frame = pd.read_csv(BytesIO(response.content), encoding="utf-8-sig", header=1)
              frame.columns = [str(c).strip() for c in frame.columns]
              if "Date" not in frame.columns or "10Y" not in frame.columns:
                  raise ValueError(f"Unexpected historical MOF columns: {list(frame.columns)}")
              dates = pd.to_datetime(frame["Date"], errors="coerce")
              values = pd.to_numeric(frame["10Y"].replace("-", pd.NA), errors="coerce")
              valid = dates.notna() & values.notna()
              for date, value in zip(dates[valid], values[valid]):
                  day = date.strftime("%Y-%m-%d")
                  val = float(value)
                  jp_rows.append((day, val))
                  daily_history.setdefault(day, {})["jp10y"] = round(val, 4)
          except Exception as exc:
              print(f"WARNING: historical Japan 10Y data unavailable: {exc}", flush=True)

          try:
              response = requests.get(latest_url, timeout=30)
              response.raise_for_status()
              latest_frame = None
              for encoding in ("cp932", "utf-8-sig", "shift_jis"):
                  try:
                      candidate = pd.read_csv(BytesIO(response.content), encoding=encoding, header=1)
                      if not candidate.empty:
                          latest_frame = candidate
                          break
                  except Exception:
                      pass

              if latest_frame is not None:
                  latest_frame.columns = [str(c).strip() for c in latest_frame.columns]
                  date_col = next((c for c in latest_frame.columns if c in ("基準日", "年月日", "日付", "Date", "date")), None)
                  value_col = "10年" if "10年" in latest_frame.columns else None
                  if date_col and value_col:
                      for _, row in latest_frame.iterrows():
                          raw_date = str(row[date_col]).strip()
                          if not raw_date.startswith(("R", "H", "S")):
                              continue
                          try:
                              era, rest = raw_date[0], raw_date[1:]
                              year, month, day_num = [int(x) for x in rest.split(".")]
                              year = {"R": 2018, "H": 1988, "S": 1925}[era] + year
                              day = datetime(year, month, day_num).strftime("%Y-%m-%d")
                              val = float(str(row[value_col]).replace("%", "").replace(",", "").strip())
                              jp_rows.append((day, val))
                              daily_history.setdefault(day, {})["jp10y"] = round(val, 4)
                          except Exception:
                              continue
          except Exception as exc:
              print(f"WARNING: latest Japan 10Y data unavailable: {exc}", flush=True)

          jp_by_date = {}
          for day, value in jp_rows:
              jp_by_date[day] = value
          if jp_by_date:
              ordered_jp = sorted(jp_by_date.items())
              indicator_updates["jp10y"] = {
                  "latest": {"date": ordered_jp[-1][0], "value": round(ordered_jp[-1][1], 4)},
                  "previous": ({
                      "date": ordered_jp[-2][0], "value": round(ordered_jp[-2][1], 4)
                  } if len(ordered_jp) > 1 else None),
                  "source": latest_url,
                  "history_source": historical_url,
              }
              print(f"jp10y: latest={indicator_updates['jp10y']['latest']}", flush=True)
          else:
              print("WARNING: no valid Japan 10Y data; keeping existing value if present", flush=True)

          # Merge updates into existing files instead of rebuilding them, so the
          # Japanese index series and unrelated keys remain untouched.
          data_path = Path("data.json")
          payload = json.loads(data_path.read_text(encoding="utf-8")) if data_path.exists() else {}
          existing_data = payload.get("data")
          if not isinstance(existing_data, dict):
              existing_data = {}
          existing_data.update(index_updates)
          payload["data"] = existing_data

          existing_indicators = payload.get("indicators")
          if not isinstance(existing_indicators, dict):
              existing_indicators = {}
          existing_indicators.update(indicator_updates)
          payload["indicators"] = existing_indicators
          payload["updatedAt"] = datetime.now(timezone.utc).isoformat(timespec="seconds")
          data_path.write_text(
              json.dumps(payload, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )

          history_path = Path("market_history.json")
          try:
              history_payload = json.loads(history_path.read_text(encoding="utf-8"))
              if not isinstance(history_payload, dict):
                  history_payload = {}
          except (FileNotFoundError, json.JSONDecodeError):
              history_payload = {}

          old_history = history_payload.get("data")
          if not isinstance(old_history, dict):
              old_history = {}
          for day, values in daily_history.items():
              if day not in old_history or not isinstance(old_history[day], dict):
                  old_history[day] = {}
              old_history[day].update(values)

          history_payload = {
              "updatedAt": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "data": dict(sorted(old_history.items())),
          }
          history_path.write_text(
              json.dumps(history_payload, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          print("Updated US indexes and market indicators", flush=True)
          PY

      - name: Commit updated data
        run: |
          if git diff --quiet -- data.json market_history.json; then
            echo "No market data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json market_history.json
            git commit -m "Update US indexes and market indicators"
            git push origin HEAD:main
          fi
