name: Update Stock Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1-6"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install yfinance pandas requests

      - name: Download stock data
        run: |
          python - <<'PY'
          import yfinance as yf
          import json
          from datetime import datetime, timezone

          symbols = {
              "nikkei": "^N225",
              "topix": "1306.T",
              "nasdaq": "^IXIC",
              "sox": "^SOX",
              # グロース250連動ETN
              "growth250": "2042.T",
          }

          result = {}

          for name, symbol in symbols.items():
              df = yf.download(
                  symbol,
                  period="5y",
                  interval="1d",
                  auto_adjust=False,
                  progress=False
              )

              if df.empty:
                  raise RuntimeError(f"No data received for {symbol}")

              close = df["Close"]
              if getattr(close, "ndim", 1) > 1:
                  close = close.iloc[:, 0]

              records = {}
              for i in range(len(close)):
                  value = float(close.iloc[i])
                  if i > 0:
                      previous = float(close.iloc[i - 1])
                      change = round(value - previous, 2)
                      pct = round((value / previous - 1) * 100, 2)
                  else:
                      change = None
                      pct = None

                  day = close.index[i].strftime("%Y-%m-%d")
                  records[day] = {
                      "close": round(value, 2),
                      "change": change,
                      "pct": pct
                  }

              result[name] = records
              print(f"{name}: {len(records)} records")

          # 市場環境パネル用：WTI原油先物、米国10年国債利回り
          # 日次履歴も蓄積するため、取得可能な過去データをまとめて取得する。
          indicators = {}
          daily_indicator_history = {}
          indicator_symbols = {
              "wti": "CL=F",
              "us10y": "^TNX",
          }

          for name, symbol in indicator_symbols.items():
              df = yf.download(
                  symbol,
                  period="5y",
                  interval="1d",
                  auto_adjust=False,
                  progress=False
              )
              if df.empty:
                  print(f"WARNING: no data received for indicator {symbol}")
                  indicators[name] = {"latest": None, "previous": None}
                  continue

              close = df["Close"]
              if getattr(close, "ndim", 1) > 1:
                  close = close.iloc[:, 0]
              close = close.dropna()
              if close.empty:
                  indicators[name] = {"latest": None, "previous": None}
                  continue

              for date_index, price in close.items():
                  day = date_index.strftime("%Y-%m-%d")
                  daily_indicator_history.setdefault(day, {})[name] = round(float(price), 4)

              indicators[name] = {
                  "latest": {
                      "date": close.index[-1].strftime("%Y-%m-%d"),
                      "value": round(float(close.iloc[-1]), 4)
                  },
                  "previous": ({
                      "date": close.index[-2].strftime("%Y-%m-%d"),
                      "value": round(float(close.iloc[-2]), 4)
                  } if len(close) > 1 else None)
              }

          # 財務省公式CSVから日本10年国債利回りを取得。
          # CSVのタイトル行を飛ばし、基準日が和暦形式のデータ行だけを使う。
          import pandas as pd
          import requests
          from io import BytesIO

          mof_url = "https://www.mof.go.jp/jgbs/reference/interest_rate/jgbcm.csv"
          japan10y = {"latest": None, "previous": None, "source": mof_url}
          try:
              response = requests.get(mof_url, timeout=30)
              response.raise_for_status()
              mof_df = None
              for encoding in ("cp932", "utf-8-sig", "shift_jis"):
                  try:
                      candidate = pd.read_csv(
                          BytesIO(response.content), encoding=encoding, header=1
                      )
                      if not candidate.empty:
                          mof_df = candidate
                          break
                  except Exception:
                      pass

              if mof_df is not None:
                  ten_year_cols = [c for c in mof_df.columns if str(c).strip() == "10年"]
                  date_cols = [c for c in mof_df.columns if str(c).strip() in ("基準日", "年月日", "日付", "date", "Date")]
                  if ten_year_cols and date_cols:
                      col = ten_year_cols[0]
                      date_col = date_cols[0]
                      date_text = mof_df[date_col].astype(str).str.strip()
                      valid_rows = mof_df.loc[date_text.str.match(r"^R\d+\.\d+\.\d+$", na=False)]

                      parsed_rows = []
                      for _, row in valid_rows.iterrows():
                          try:
                              raw_date = str(row[date_col]).strip()
                              parts = raw_date[1:].split(".")
                              year = 2018 + int(parts[0])
                              month = int(parts[1])
                              day_num = int(parts[2])
                              iso_date = datetime(year, month, day_num).strftime("%Y-%m-%d")
                              raw_value = str(row[col]).replace("%", "").replace(",", "").strip()
                              value = float(raw_value)
                              parsed_rows.append((iso_date, value))
                              daily_indicator_history.setdefault(iso_date, {})["jp10y"] = round(value, 4)
                          except Exception as row_error:
                              print(f"WARNING: skipping MOF row: {row_error}")

                      parsed_rows.sort(key=lambda item: item[0])
                      if parsed_rows:
                          latest_date, latest_value = parsed_rows[-1]
                          previous = ({"date": parsed_rows[-2][0], "value": round(parsed_rows[-2][1], 4)}
                                      if len(parsed_rows) > 1 else None)
                          japan10y["latest"] = {"date": latest_date, "value": round(latest_value, 4)}
                          japan10y["previous"] = previous
                          print("Japan 10Y latest:", japan10y["latest"])
                      else:
                          print("WARNING: no valid dated rows found in MOF CSV")
                  else:
                      print("WARNING: MOF date or 10Y column not found; columns:", [str(c) for c in mof_df.columns])
              else:
                  print("WARNING: unable to parse MOF CSV")
          except Exception as e:
              print(f"WARNING: unable to fetch Japan 10Y yield from MOF: {e}")

          indicators["jp10y"] = japan10y

          # 日付ごとのマーケット指標履歴を既存ファイルにマージして保存。
          history_path = "market_history.json"
          try:
              with open(history_path, "r", encoding="utf-8") as f:
                  market_history = json.load(f)
              if not isinstance(market_history, dict):
                  market_history = {}
          except (FileNotFoundError, json.JSONDecodeError):
              market_history = {}

          history_data = market_history.get("data", {})
          if not isinstance(history_data, dict):
              history_data = {}

          for day, values in daily_indicator_history.items():
              if day not in history_data or not isinstance(history_data[day], dict):
                  history_data[day] = {}
              history_data[day].update(values)

          market_history = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "data": dict(sorted(history_data.items()))
          }
          with open(history_path, "w", encoding="utf-8") as f:
              json.dump(market_history, f, ensure_ascii=False)

          print(f"market_history.json created/updated: {len(history_data)} dates")

          output = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "data": result,
              "indicators": indicators
          }

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False)

          print("data.json created successfully")
          PY

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json market_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update stock market data"
            git push origin HEAD:main
          else
            echo "No data changes"
          fi
