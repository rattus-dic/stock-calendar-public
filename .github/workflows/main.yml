name: Update Stock Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1-6"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install yfinance pandas requests

      - name: Download stock data
        run: |
          python - <<'PY'
          import yfinance as yf
          import json
          from datetime import datetime, timezone

          symbols = {
              "nikkei": "^N225",
              "topix": "1306.T",
              "nasdaq": "^IXIC",
              "sox": "^SOX",
              # グロース250連動ETN
              "growth250": "2042.T",
          }

          result = {}

          for name, symbol in symbols.items():
              df = yf.download(
                  symbol,
                  period="5y",
                  interval="1d",
                  auto_adjust=False,
                  progress=False
              )

              if df.empty:
                  raise RuntimeError(f"No data received for {symbol}")

              close = df["Close"]
              if getattr(close, "ndim", 1) > 1:
                  close = close.iloc[:, 0]

              records = {}
              for i in range(len(close)):
                  value = float(close.iloc[i])
                  if i > 0:
                      previous = float(close.iloc[i - 1])
                      change = round(value - previous, 2)
                      pct = round((value / previous - 1) * 100, 2)
                  else:
                      change = None
                      pct = None

                  day = close.index[i].strftime("%Y-%m-%d")
                  records[day] = {
                      "close": round(value, 2),
                      "change": change,
                      "pct": pct
                  }

              result[name] = records
              print(f"{name}: {len(records)} records")

          # 市場環境パネル用：WTI原油先物、米国10年国債利回り
          # 日次履歴も蓄積するため、取得可能な過去データをまとめて取得する。
          indicators = {}
          daily_indicator_history = {}
          indicator_symbols = {
              "wti": "CL=F",
              "brent": "BZ=F",
              "us10y": "^TNX",
          }

          for name, symbol in indicator_symbols.items():
              df = yf.download(
                  symbol,
                  period="5y",
                  interval="1d",
                  auto_adjust=False,
                  progress=False
              )
              if df.empty:
                  print(f"WARNING: no data received for indicator {symbol}")
                  indicators[name] = {"latest": None, "previous": None}
                  continue

              close = df["Close"]
              if getattr(close, "ndim", 1) > 1:
                  close = close.iloc[:, 0]
              close = close.dropna()
              if close.empty:
                  indicators[name] = {"latest": None, "previous": None}
                  continue

              for date_index, price in close.items():
                  day = date_index.strftime("%Y-%m-%d")
                  daily_indicator_history.setdefault(day, {})[name] = round(float(price), 4)

              indicators[name] = {
                  "latest": {
                      "date": close.index[-1].strftime("%Y-%m-%d"),
                      "value": round(float(close.iloc[-1]), 4)
                  },
                  "previous": ({
                      "date": close.index[-2].strftime("%Y-%m-%d"),
                      "value": round(float(close.iloc[-2]), 4)
                  } if len(close) > 1 else None)
              }

          # 財務省公式の全期間CSVで日本10年債の日次履歴をバックフィルし、
          # 最新CSVで直近値を更新する。
          import pandas as pd
          import requests
          from io import BytesIO

          historical_mof_url = "https://www.mof.go.jp/english/policy/jgbs/reference/interest_rate/historical/jgbcme_all.csv"
          latest_mof_url = "https://www.mof.go.jp/jgbs/reference/interest_rate/jgbcm.csv"
          japan10y = {"latest": None, "previous": None, "source": latest_mof_url, "history_source": historical_mof_url}
          parsed_jp_rows = []

          try:
              # 全期間CSVは1行目がタイトル、2行目が英語ヘッダー。
              response = requests.get(historical_mof_url, timeout=45)
              response.raise_for_status()
              hist_df = pd.read_csv(BytesIO(response.content), encoding="utf-8-sig", header=1)
              hist_df.columns = [str(c).strip() for c in hist_df.columns]
              if "Date" not in hist_df.columns or "10Y" not in hist_df.columns:
                  raise ValueError(f"Unexpected historical MOF columns: {list(hist_df.columns)}")

              hist_dates = pd.to_datetime(hist_df["Date"], errors="coerce")
              hist_values = pd.to_numeric(hist_df["10Y"].replace("-", pd.NA), errors="coerce")
              valid_hist = hist_df.loc[hist_dates.notna() & hist_values.notna()].copy()
              valid_hist["_date"] = hist_dates[hist_dates.notna() & hist_values.notna()].dt.strftime("%Y-%m-%d")
              valid_hist["_value"] = hist_values[hist_dates.notna() & hist_values.notna()]

              for _, row in valid_hist.iterrows():
                  day = str(row["_date"])
                  value = float(row["_value"])
                  parsed_jp_rows.append((day, value))
                  daily_indicator_history.setdefault(day, {})["jp10y"] = round(value, 4)
              print(f"Japan 10Y historical rows: {len(parsed_jp_rows)}")
          except Exception as hist_error:
              print(f"WARNING: unable to backfill Japan 10Y history: {hist_error}")

          # 最新CSVは和暦の日付なので、過去データを補完したうえで最新値を更新する。
          try:
              response = requests.get(latest_mof_url, timeout=30)
              response.raise_for_status()
              latest_df = None
              for encoding in ("cp932", "utf-8-sig", "shift_jis"):
                  try:
                      candidate = pd.read_csv(BytesIO(response.content), encoding=encoding, header=1)
                      if not candidate.empty:
                          latest_df = candidate
                          break
                  except Exception:
                      pass

              if latest_df is not None:
                  latest_df.columns = [str(c).strip() for c in latest_df.columns]
                  date_col = next((c for c in latest_df.columns if c in ("基準日", "年月日", "日付", "Date", "date")), None)
                  value_col = next((c for c in latest_df.columns if c == "10年"), None)
                  if date_col and value_col:
                      for _, row in latest_df.iterrows():
                          raw_date = str(row[date_col]).strip()
                          if not raw_date.startswith(("R", "H", "S")):
                              continue
                          try:
                              era, rest = raw_date[0], raw_date[1:]
                              parts = [int(x) for x in rest.split(".")]
                              base_year = {"R": 2018, "H": 1988, "S": 1925}[era]
                              parsed_date = datetime(base_year + parts[0], parts[1], parts[2]).strftime("%Y-%m-%d")
                              raw_value = str(row[value_col]).replace("%", "").replace(",", "").strip()
                              value = float(raw_value)
                              parsed_jp_rows.append((parsed_date, value))
                              daily_indicator_history.setdefault(parsed_date, {})["jp10y"] = round(value, 4)
                          except Exception:
                              continue
          except Exception as latest_error:
              print(f"WARNING: unable to refresh latest Japan 10Y yield: {latest_error}")

          # 日付ごとに重複を除き、最新値と前営業日値を設定。
          jp_by_date = {}
          for day, value in parsed_jp_rows:
              jp_by_date[day] = value
          for day, values in daily_indicator_history.items():
              if "jp10y" in values:
                  jp_by_date[day] = values["jp10y"]
          sorted_jp = sorted(jp_by_date.items())
          if sorted_jp:
              latest_date, latest_value = sorted_jp[-1]
              japan10y["latest"] = {"date": latest_date, "value": round(latest_value, 4)}
              japan10y["previous"] = ({"date": sorted_jp[-2][0], "value": round(sorted_jp[-2][1], 4)} if len(sorted_jp) > 1 else None)
              print(f"Japan 10Y history rows: {len(sorted_jp)}")
              print("Japan 10Y latest:", japan10y["latest"])
          else:
              print("WARNING: no valid Japan 10Y historical rows found")

          indicators["jp10y"] = japan10y

          # 日付ごとのマーケット指標履歴を既存ファイルにマージして保存。
          history_path = "market_history.json"
          try:
              with open(history_path, "r", encoding="utf-8") as f:
                  market_history = json.load(f)
              if not isinstance(market_history, dict):
                  market_history = {}
          except (FileNotFoundError, json.JSONDecodeError):
              market_history = {}

          history_data = market_history.get("data", {})
          if not isinstance(history_data, dict):
              history_data = {}

          for day, values in daily_indicator_history.items():
              if day not in history_data or not isinstance(history_data[day], dict):
                  history_data[day] = {}
              history_data[day].update(values)

          market_history = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "data": dict(sorted(history_data.items()))
          }
          with open(history_path, "w", encoding="utf-8") as f:
              json.dump(market_history, f, ensure_ascii=False)

          print(f"market_history.json created/updated: {len(history_data)} dates")

          output = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "data": result,
              "indicators": indicators
          }

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False)

          print("data.json created successfully")
          PY

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json market_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update stock market data"
            git push origin HEAD:main
          else
            echo "No data changes"
          fi
