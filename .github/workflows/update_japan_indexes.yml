name: Update Japan Index Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1-5" # 17:00 JST, Monday-Friday

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade yfinance pandas

      - name: Update Japanese index data only
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, time, timezone
          from pathlib import Path
          from urllib.parse import quote
          from zoneinfo import ZoneInfo
          import requests
          import yfinance as yf

          symbols = {
              "nikkei": "^N225",
              "topix": "1306.T",
              # グロース250連動ETN（指数そのものではない）
              "growth250": "2516.T",
          }

          result = {}
          for name, symbol in symbols.items():
              df = yf.download(
                  symbol,
                  period="5y",
                  interval="1d",
                  auto_adjust=False,
                  progress=False,
              )
              if df.empty or "Close" not in df:
                  raise RuntimeError(f"No data received for {symbol}; refusing to publish partial update")

              close = df["Close"]
              if getattr(close, "ndim", 1) > 1:
                  close = close.iloc[:, 0]
              close = close.dropna()
              if close.empty:
                  raise RuntimeError(f"No valid closing prices for {symbol}")

              records = {}
              previous = None
              for timestamp, raw_value in close.items():
                  value = float(raw_value)
                  change = round(value - previous, 2) if previous is not None else None
                  pct = round((value / previous - 1) * 100, 2) if previous not in (None, 0) else None
                  records[timestamp.strftime("%Y-%m-%d")] = {
                      "close": round(value, 2),
                      "change": change,
                      "pct": pct,
                  }
                  previous = value

              # Yahoo chart history can lag the latest quote for ^N225 and 1306.T.
              # If the daily series is behind, inspect Yahoo's quote timestamp and
              # only append the quote when it is dated after the latest daily bar
              # and the timestamp is at/after the Tokyo market close.
              if name in ("nikkei", "topix"):
                  try:
                      url = f"https://query1.finance.yahoo.com/v8/finance/chart/{quote(symbol, safe='')}"
                      response = requests.get(
                          url,
                          params={"range": "5d", "interval": "1d"},
                          headers={"User-Agent": "Mozilla/5.0 (compatible; StockCalendar/1.0)"},
                          timeout=20,
                      )
                      response.raise_for_status()
                      chart = response.json().get("chart", {})
                      if chart.get("error"):
                          raise RuntimeError(chart["error"])
                      quote_results = chart.get("result") or []
                      if not quote_results:
                          raise RuntimeError("Yahoo chart API returned no result")
                      meta = quote_results[0].get("meta") or {}
                      quote_price = meta.get("regularMarketPrice")
                      quote_timestamp = meta.get("regularMarketTime")
                      if quote_price is None or quote_timestamp is None:
                          raise RuntimeError("Latest quote price or timestamp is missing")

                      tokyo = ZoneInfo("Asia/Tokyo")
                      quote_dt = datetime.fromtimestamp(int(quote_timestamp), tokyo)
                      latest_daily_date = datetime.strptime(next(reversed(records)), "%Y-%m-%d").date()
                      quote_date = quote_dt.date()
                      print(
                          f"QUOTE CHECK {name}: price={float(quote_price):.2f}; "
                          f"timestamp={quote_dt.isoformat()}; latest_daily={latest_daily_date}"
                      )

                      if quote_date > latest_daily_date and quote_dt.time().replace(tzinfo=None) >= time(15, 30):
                          previous_close = records[next(reversed(records))]["close"]
                          value = round(float(quote_price), 2)
                          records[quote_date.isoformat()] = {
                              "close": value,
                              "change": round(value - previous_close, 2),
                              "pct": round((value / previous_close - 1) * 100, 2) if previous_close else None,
                          }
                          print(
                              f"FALLBACK ADDED {name}: {quote_date.isoformat()} close={value:.2f} "
                              f"(quote timestamp is after Tokyo market close)"
                          )
                      elif quote_date > latest_daily_date:
                          print(
                              f"WARNING {name}: quote date is newer but timestamp is before market close; "
                              "not adding an unconfirmed close"
                          )
                  except Exception as exc:
                      print(f"WARNING {name}: latest-quote fallback unavailable: {type(exc).__name__}: {exc}")

              result[name] = records
              print(f"SUCCESS {name} ({symbol}): {len(records)} rows; latest={next(reversed(records))}")

          path = Path("data.json")
          if path.exists():
              payload = json.loads(path.read_text(encoding="utf-8"))
          else:
              payload = {}
          old_data = payload.get("data", {})
          if not isinstance(old_data, dict):
              old_data = {}

          # Replace only Japanese index series; preserve NASDAQ, SOX, and all other series.
          old_data.update(result)
          payload["updatedAt"] = datetime.now(timezone.utc).isoformat(timespec="seconds")
          payload["data"] = old_data
          path.write_text(json.dumps(payload, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          print("Updated Japanese indexes only; existing indicators and other series preserved.")
          PY

      - name: Commit updated data
        run: |
          if git diff --quiet -- data.json; then
            echo "No stock data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Update Japanese index data"
            git push origin HEAD:main
          fi
