name: Update Japan Stock Indexes

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1-5" # 17:00 JST, Monday-Friday

permissions:
  contents: write

# Prevent concurrent writes with the morning market-indicator workflow.
concurrency:
  group: stock-data-update
  cancel-in-progress: false

jobs:
  update-japan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests

      - name: Download Japanese index data
        run: |
          python - <<'PY'
          import json
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote
          from zoneinfo import ZoneInfo

          import requests

          symbols = {
              "nikkei": "^N225",
              "topix": "1306.T",
              # This is an ETN linked to Growth 250, not the index itself.
              "growth250": "2042.T",
          }
          max_attempts = 3
          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0 (compatible; StockCalendar/1.0)"})

          def download_close(name, symbol):
              """Fetch daily closes directly from Yahoo Finance's chart endpoint."""
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{quote(symbol, safe='')}"
              for attempt in range(1, max_attempts + 1):
                  try:
                      print(
                          f"Downloading {name} ({symbol}) via Yahoo chart API, attempt {attempt}/{max_attempts}",
                          flush=True,
                      )
                      response = session.get(
                          url,
                          params={"range": "5y", "interval": "1d", "events": "history"},
                          timeout=30,
                      )
                      response.raise_for_status()
                      body = response.json().get("chart", {})
                      if body.get("error"):
                          raise RuntimeError(f"Yahoo chart API error: {body['error']}")
                      results = body.get("result") or []
                      if not results:
                          raise RuntimeError("Yahoo chart API returned no result")
                      result = results[0]
                      timestamps = result.get("timestamp") or []
                      quote_rows = (result.get("indicators", {}).get("quote") or [{}])[0]
                      closes = quote_rows.get("close") or []
                      exchange_tz = (result.get("meta") or {}).get("exchangeTimezoneName", "Asia/Tokyo")
                      tz = ZoneInfo(exchange_tz)
                      rows = []
                      for stamp, raw_close in zip(timestamps, closes):
                          if raw_close is None:
                              continue
                          day = datetime.fromtimestamp(stamp, tz).strftime("%Y-%m-%d")
                          rows.append((day, float(raw_close)))
                      if not rows:
                          raise RuntimeError("Yahoo chart API returned no valid closing prices")
                      rows.sort(key=lambda item: item[0])
                      latest = rows[-1][0]
                      print(f"{name}: received {len(rows)} rows; latest={latest}; timezone={exchange_tz}", flush=True)
                      return rows
                  except Exception as exc:
                      print(f"WARNING: {name} attempt {attempt} failed: {exc}", flush=True)
                      if attempt < max_attempts:
                          time.sleep(5 * attempt)
              print(f"ERROR: giving up on {name}; existing data will be preserved", flush=True)
              return None

          downloaded = {name: download_close(name, symbol) for name, symbol in symbols.items()}

          latest_dates = {
              name: rows[-1][0]
              for name, rows in downloaded.items() if rows is not None
          }
          reference_date = max(latest_dates.values()) if latest_dates else None
          if reference_date:
              print(f"Newest date returned by any Japanese series: {reference_date}", flush=True)
              for name, symbol in symbols.items():
                  rows = downloaded[name]
                  if rows is None or latest_dates[name] >= reference_date:
                      continue
                  print(
                      f"WARNING: {name} is behind ({latest_dates[name]} < {reference_date}); retrying this symbol",
                      flush=True,
                  )
                  retry_rows = download_close(name, symbol)
                  if retry_rows is not None and retry_rows[-1][0] >= reference_date:
                      downloaded[name] = retry_rows
                      latest_dates[name] = retry_rows[-1][0]
                  else:
                      print(
                          f"WARNING: {name} still behind; its existing data will be preserved",
                          flush=True,
                      )
                      downloaded[name] = None

          updates = {}
          for name, rows in downloaded.items():
              if rows is None:
                  continue
              output = {}
              previous = None
              for day, value in rows:
                  change = value - previous if previous is not None else None
                  pct = (change / previous * 100.0) if previous not in (None, 0) else None
                  output[day] = {
                      "close": round(value, 4),
                      "change": round(change, 4) if change is not None else None,
                      "pct": round(pct, 4) if pct is not None else None,
                  }
                  previous = value
              updates[name] = output
              print(f"READY: {name}; latest={next(reversed(output))}", flush=True)

          if not updates:
              raise RuntimeError("No Japanese index data could be refreshed; existing data preserved")

          # Preserve US index data, market indicators, and Japanese series that
          # could not be refreshed in this run.
          path = Path("data.json")
          payload = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          existing_data = payload.get("data")
          if not isinstance(existing_data, dict):
              existing_data = {}
          existing_data.update(updates)
          payload["data"] = existing_data
          payload["updatedAt"] = datetime.now(timezone.utc).isoformat(timespec="seconds")
          path.write_text(
              json.dumps(payload, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          print(f"Updated Japanese indexes: {', '.join(sorted(updates))}; skipped: {', '.join(sorted(set(symbols) - set(updates)))}", flush=True)
          PY

      - name: Commit updated data
        run: |
          if git diff --quiet -- data.json; then
            echo "No Japanese index data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Update Japanese stock indexes"
            git push origin HEAD:main
          fi
